[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swadl"
version = "0.2.0"
description = "Selenium Webdriver Accelerated Development Library"
readme = "README.md"
authors = [
    { name = "Akien Macnamara", email = "akienm@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "selenium",
    "python-diagnostic-base-class>=0.1",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "pytest",
    "nose2",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["*.json"]
